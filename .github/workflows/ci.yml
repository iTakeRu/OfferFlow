name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release inputs
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag does not match the app version" }
          if (git ls-files -- data portable .claude '*.db' '*.db-wal' '*.db-shm' '*.mhtml' '*.docx' '*.pdf') {
            throw "Unexpected local data in source tree"
          }
      - run: npm ci
      - run: npm run tauri -- build -- --locked
      - name: Publish Windows x64 downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $base = "OfferFlow_$($tag.Substring(1))_x64"
          $build = "src-tauri/target/release"
          $out = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'downloads')
          Copy-Item -LiteralPath "$build/bundle/nsis/$base-setup.exe", "$build/bundle/msi/${base}_en-US.msi" -Destination $out.FullName
          Copy-Item -LiteralPath "$build/offerflow.exe" -Destination (Join-Path $out.FullName "$base.exe")
          $packages = @(Get-ChildItem -LiteralPath $out.FullName -File | Sort-Object Name)
          $sums = Join-Path $out.FullName 'SHA256SUMS.txt'
          $packages | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content -Encoding ascii $sums
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $entry = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($tag)) [^\n]*\n(.+?)(?=^## v|\z)")
          if (!$entry.Success) { throw "Missing changelog entry for $tag" }
          $entry.Groups[1].Value.Trim() | Set-Content -Encoding utf8 $notes
          $assets = @($packages.FullName) + $sums
          gh release create $tag @assets --verify-tag --latest --title "OfferFlow $tag" --notes-file $notes
